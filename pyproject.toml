[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repotruth"
version = "0.3.0"
description = "Evidence-first README claim verifier for GitHub repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "flokiss42" }]
keywords = ["github", "readme", "quality", "static-analysis", "ai-generated-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
repotruth = "repotruth.cli:main"

[tool.setuptools.packages.find]
include = ["repotruth*"]

[tool.setuptools.package-data]
repotruth = ["web/*.html", "web/*.css", "web/*.js"]
